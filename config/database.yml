default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: kaufhaus_development

test:
  <<: *default
  database: kaufhaus_test

production:
  primary:
    url: <%= ENV["DATABASE_URL"] %>
    # Kaufhaus keeps its tables in their own schema rather than adding them to the
    # database it shares with other projects.
    schema_search_path: kaufhaus
